<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b32"><title>NMCC Youth Activities Calendar</title><style>
:root{color-scheme:light;--ink:#17332d;--muted:#5a6d68;--bg:#f4f7f4;--card:#fff;--line:#d7e2dc;--green:#17634f;--gold:#e8b44b;--red:#a83232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,sans-serif}header{background:var(--green);color:white;padding:1.4rem 1rem 1.8rem}header>div,main{max-width:54rem;margin:auto}header p{margin:.3rem 0;color:#e3eee9}h1{margin:.2rem 0;font-size:clamp(1.7rem,5vw,2.5rem)}main{padding:1rem}.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}.toolbar button,.btn{border:0;border-radius:.55rem;padding:.7rem 1rem;background:var(--green);color:white;font:inherit;cursor:pointer;min-height:44px}.secondary{background:transparent!important;color:var(--green)!important;border:1px solid var(--line)!important}.danger{background:var(--red)!important}.event{display:grid;grid-template-columns:4.2rem 1fr;gap:1rem;background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:1rem;margin:.8rem 0;box-shadow:0 2px 9px #153d2b0a}.date{border-radius:.6rem;background:#f8eac8;color:#493715;text-align:center;padding:.5rem .2rem;height:max-content;font-weight:650}.date b{display:block;font-size:1.6rem;line-height:1.25}.event h2{font-size:1.12rem;margin:0}.meta,.muted{color:var(--muted);margin:.2rem 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:2rem;padding:.05rem .5rem;font-size:.78rem;margin-left:.3rem}label{display:block;font-weight:650;margin:.65rem 0}input,textarea,select{display:block;width:100%;padding:.7rem;border:1px solid #aebfb6;border-radius:.5rem;font:inherit;background:white;color:#17332d;margin:.2rem 0}input[type=checkbox]{display:inline;width:auto;min-height:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}.alert{color:var(--red)}.empty{padding:1.5rem;border:1px dashed var(--line);border-radius:.8rem;text-align:center}.event-actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}.availability-panel{margin:1rem 0;padding:1rem;border:1px solid var(--line);border-radius:.8rem;background:#fff}.availability-panel code{font-size:.9em}footer{padding:1rem 0 2rem;color:var(--muted);font-size:.9rem}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:480px){.event{grid-template-columns:3.6rem 1fr;gap:.7rem;padding:.75rem}.grid{grid-template-columns:1fr}}
</style></head><body><header><div><p>NGCULWINI MIRACLE CENTRE</p><h1>Youth Activities Calendar</h1><p>One place to see what is coming up.</p></div></header><main id="app" aria-live="polite"><p>Loading activities…</p></main><script>
const $=s=>document.querySelector(s),app=$('#app'),months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,o={})=>{const r=await fetch('/api'+p,{...o,headers:{'content-type':'application/json',...(o.headers||{})},body:o.body===undefined?undefined:JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||(j.errors||[]).join(' ')||'Request failed'),{status:r.status});return j};
const card=e=>{const d=new Date(e.date+'T12:00:00Z');return '<article class="event"><div class="date"><b>'+d.getUTCDate()+'</b>'+months[d.getUTCMonth()]+'</div><div><h2>'+esc(e.title)+'</h2><p class="meta">'+(e.all_day?'All day':esc(e.start_time)+(e.end_time?'–'+esc(e.end_time):''))+(e.location?' · '+esc(e.location):'')+(e.category==='meeting'?' <span class="tag">Meeting</span>':'')+(e.published===0?' <span class="tag">Draft</span>':'')+(e.cancelled?' <span class="tag">Cancelled</span>':'')+'</p>'+(e.description?'<p>'+esc(e.description)+'</p>':'')+(e.actions||'')+'</div></article>'};
async function pub(){app.innerHTML='<p>Loading activities…</p>';try{const ev=await api('/events');app.innerHTML='<div class="toolbar"><button id="refresh" class="secondary">Refresh</button></div>'+(ev.length?ev.map(card).join(''):'<section class="empty"><h2>No upcoming activities yet</h2><p>Check back soon for the next youth programme.</p></section>')+'<footer><a href="#admin">Organiser sign-in</a></footer>';$('#refresh').onclick=pub}catch(e){app.innerHTML='<p class="alert">We could not load activities. Check your connection and refresh.</p><button id="retry">Try again</button>';$('#retry').onclick=pub}}
function login(msg=''){app.innerHTML='<h2>Calendar sign-in</h2><p class="muted">For authorised Ngculwini Miracle Centre calendar users.</p><form id="login"><label>Phone number<input name="phone" type="tel" autocomplete="username" placeholder="+268…" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><p class="alert" role="alert">'+esc(msg)+'</p><button class="btn">Sign in</button> <a href="#">Public calendar</a></form>';$('#login').onsubmit=async e=>{e.preventDefault();try{await api('/login',{method:'POST',body:Object.fromEntries(new FormData(e.target))});await admin()}catch(x){login(x.message)}}}
function parseFreeDates(ics){const lines=String(ics||'').replace(/\r?\n[ \t]/g,'').split(/\r?\n/);const blocks=[];let block=null;for(const line of lines){if(line==='BEGIN:VEVENT'){block=[];continue}if(line==='END:VEVENT'){if(block)blocks.push(block);block=null;continue}if(block)block.push(line)}const dates=new Set();for(const b of blocks){const summary=b.find(x=>/^SUMMARY(?:;[^:]*)?:/i.test(x));const start=b.find(x=>/^DTSTART(?:;[^:]*)?:/i.test(x));if(!summary||!/^SUMMARY:Free$/i.test(summary)||!start)continue;const m=start.match(/^DTSTART;VALUE=DATE:(\d{8})$/i);if(m)dates.add(m[1].slice(0,4)+'-'+m[1].slice(4,6)+'-'+m[1].slice(6,8))}return [...dates].sort()}\nlet events=[],currentUser=null;async function admin(edit){try{[events,currentUser]=await Promise.all([api('/admin/events'),api('/me')])}catch(e){login(e.status===401?'':e.message);return}const runs=await api('/admin/runs').catch(()=>[]),users=currentUser.role==='administrator'?await api('/admin/users').catch(()=>[]):[],v=edit||{category:'activity',published:0,cancelled:0};app.innerHTML='<div class="toolbar"><button class="secondary" id="logout">Sign out</button><a class="btn secondary" href="#">Public calendar</a></div><h2>'+(edit?'Edit activity':'Add an activity')+'</h2><form id="eventform"><label>Title<input name="title" maxlength="120" required value="'+esc(v.title)+'"></label><div class="grid"><label>Date<input name="date" type="date" required value="'+esc(v.date)+'"></label><label>Start time<input name="start_time" type="time" required value="'+esc(v.start_time)+'"></label><label>End time (optional)<input name="end_time" type="time" value="'+esc(v.end_time)+'"></label><label>Category<select name="category"><option value="activity" '+(v.category==='activity'?'selected':'')+'>Activity</option><option value="meeting" '+(v.category==='meeting'?'selected':'')+'>Meeting</option></select></label></div><label><input type="checkbox" name="all_day" '+(v.all_day?'checked':'')+'> All-day activity (no specific time)</label><label>Location<input name="location" maxlength="200" value="'+esc(v.location)+'"></label><label>Description<textarea name="description" rows="3" maxlength="2000">'+esc(v.description)+'</textarea></label><label><input type="checkbox" name="published" '+(v.published?'checked':'')+'> Publish to public calendar</label><label><input type="checkbox" name="cancelled" '+(v.cancelled?'checked':'')+'> Cancelled</label><p id="formmsg" class="alert" role="alert"></p><button class="btn">Save activity</button> '+(edit?'<button type="button" class="btn secondary" id="cancel">Cancel edit</button>':'')+'</form><section class="availability-panel"><h2>Use your Outlook free dates</h2><p class="muted">Upload an Outlook <code>.ics</code> export. The planner reads only all-day entries named “Free”. Choose one to prefill the activity date. This runs in your browser: it does not upload the file, create an activity, or publish personal availability.</p><label>Outlook calendar export (.ics)<input id="icsFile" type="file" accept=".ics,text/calendar"></label><p id="icsmsg" class="muted" role="status">No availability file loaded.</p><label>Available date<select id="availableDate" disabled><option value="">Upload a calendar export first</option></select></label><button type="button" class="btn secondary" id="useAvailDate" disabled>Use selected date</button></section><h2>Manage activities</h2>'+(events.length?events.map(e=>card({...e,actions:'<div class="event-actions"><button class="btn secondary" data-edit="'+esc(e.id)+'">Edit</button><button class="btn secondary" data-pub="'+esc(e.id)+'">'+(e.published?'Unpublish':'Publish')+'</button><button class="btn danger" data-del="'+esc(e.id)+'">Delete</button></div>'})).join(''):'<p>No activities have been entered yet.</p>')+'<h2>Reminder status</h2><p class="muted">Generated means prepared, not delivered. Real delivery is not configured.</p><div style="overflow-x:auto"><table><tr><th>Date</th><th>Job</th><th>Status</th><th>Details</th></tr>'+runs.map(r=>'<tr><td>'+esc(r.report_date)+'</td><td>'+esc(r.job)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.detail)+'</td></tr>').join('')+'</table></div><footer>Keep a private database backup before any recovery operation. Restore is currently performed through the authorised Cloudflare account CLI, not this page.</footer>'+(currentUser.role==='administrator'?'<h2>Manage organisers</h2><p class="muted">Only the Administrator can add or deactivate organiser accounts. Organisers can add, edit and delete calendar activities.</p><form id="userform"><label>Organiser name<input name="name" maxlength="80" required></label><label>Phone number<input name="phone" type="tel" placeholder="+268…" required></label><p class="muted">Initial password format: phone number without +, then @, then the name without spaces.</p><p id="usermsg" class="alert" role="alert"></p><button class="btn">Add organiser</button></form><div>'+users.map(u=>'<article class="event"><div><h2>'+esc(u.name)+'</h2><p class="meta">'+esc(u.phone)+' · '+esc(u.role)+' · '+(u.active?'Active':'Deactivated')+'</p>'+(u.role==='organiser'?'<button class="btn secondary" data-user="'+esc(u.phone)+'" data-active="'+(u.active?'0':'1')+'">'+(u.active?'Deactivate':'Reactivate')+'</button>':'')+'</div></article>').join('')+'</div>':'');
$('#logout').onclick=async()=>{await api('/logout',{method:'POST'}).catch(()=>{});location.hash='';pub()};if($('#userform'))$('#userform').onsubmit=async e=>{e.preventDefault();try{await api('/admin/users',{method:'POST',body:Object.fromEntries(new FormData(e.target))});await admin()}catch(x){$('#usermsg').textContent=x.message}};if($('#icsFile'))$('#icsFile').onchange=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const select=$('#availableDate'),use=$('#useAvailDate'),status=$('#icsmsg');status.textContent='Reading calendar export…';try{const dates=parseFreeDates(await file.text());if(!dates.length){select.innerHTML='<option value="">No matching all-day Free dates found</option>';select.disabled=true;use.disabled=true;status.textContent='No all-day entries with the exact summary “Free” were found. No calendar data was changed.';return;}select.innerHTML='<option value="">Choose a free date</option>'+dates.map(d=>'<option value="'+d+'">'+d+'</option>').join('');select.disabled=false;use.disabled=false;status.textContent='Loaded '+dates.length+' unique available dates. Nothing has been saved or published.';}catch(err){select.innerHTML='<option value="">Could not read this file</option>';select.disabled=true;use.disabled=true;status.textContent='Could not read that file. Please choose a valid Outlook .ics export.';}};if($('#useAvailDate'))$('#useAvailDate').onclick=()=>{const date=$('#availableDate').value,field=$('#eventform [name="date"]');if(date&&field){field.value=date;field.focus();}};if($('#cancel'))$('#cancel').onclick=()=>admin();const syncAllDay=()=>{const all=$('#eventform [name="all_day"]').checked,start=$('#eventform [name="start_time"]'),end=$('#eventform [name="end_time"]');start.disabled=all;end.disabled=all;start.required=!all;};$('#eventform [name="all_day"]').onchange=()=>{const start=$('#eventform [name="start_time"]');if(!$('#eventform [name="all_day"]').checked&&start.value==='00:00')start.value='';syncAllDay();};syncAllDay();$('#eventform').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.all_day=e.target.all_day.checked;b.published=e.target.published.checked;b.cancelled=e.target.cancelled.checked;if(b.all_day){b.start_time='00:00';b.end_time='';}try{await api('/admin/events'+(edit?'/'+edit.id:''),{method:edit?'PUT':'POST',body:b});await admin()}catch(x){$('#formmsg').textContent=x.message}};
app.onclick=async e=>{const t=e.target,find=id=>events.find(x=>x.id===id);try{if(t.dataset.user){await api('/admin/users/'+encodeURIComponent(t.dataset.user),{method:'PATCH',body:{active:t.dataset.active==='1'}});return admin()}if(t.dataset.edit)return admin(find(t.dataset.edit));if(t.dataset.pub){const x=find(t.dataset.pub);await api('/admin/events/'+x.id,{method:'PUT',body:{...x,published:!x.published}});return admin()}if(t.dataset.del){const x=find(t.dataset.del);if(confirm('Delete “'+x.title+'” on '+x.date+'? This cannot be undone.')){await api('/admin/events/'+x.id,{method:'DELETE',body:{confirm:x.id}});return admin()}}}catch(x){alert(x.message)}}}
const route=()=>location.hash==='#admin'?admin():pub();addEventListener('hashchange',route);route();
</script></main></body></html>
